# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
projects:
  - name: chatwoot
    environments:
      - name: production

        envVarGroups:
          - name: chatwoot-shared
            envVars:
              - key: SECRET_KEY_BASE
                generateValue: true
              - key: RAILS_ENV
                value: production
              - key: RACK_ENV
                value: production
              - key: NODE_ENV
                value: production
              - key: INSTALLATION_ENV
                value: render
              - key: RAILS_LOG_TO_STDOUT
                value: enabled
              - key: LOG_LEVEL
                value: info
              - key: FORCE_SSL
                value: "true"
              - key: ENABLE_ACCOUNT_SIGNUP
                value: "false"
              - key: FRONTEND_URL            # e.g. https://chat.example.com
                sync: false
              # --- ActiveStorage ---
              # Local, NOT persistent (matches Heroku / DigitalOcean buttons).
              # To persist uploads, see "Enabling cloud storage" in §5.
              - key: ACTIVE_STORAGE_SERVICE
                value: local
              # --- Docker build limits ---
              # Render passes env vars to Docker as build args. Compiling grpc
              # and protobuf from source with full parallelism exceeds the
              # 8 GB build limit, so cap it (see docker/Dockerfile).
              - key: BUNDLE_JOBS
                value: "2"
              - key: MAKE_JOBS
                value: "2"
              # --- Outbound email ---
              # Not configured, same as Chatwoot's Heroku button.
              # To send email, add MAILER_SENDER_EMAIL and SMTP_* vars here.

        services:
          - type: web
            name: chatwoot-web
            runtime: docker
            region: virginia
            plan: pro
            branch: main
            dockerfilePath: ./docker/Dockerfile
            dockerContext: .
            # Single commands, no shell: Render kept the quotes in `sh -c "..."`
            # literally. Rails reads PORT from the environment.
            dockerCommand: bundle exec rails server -b 0.0.0.0
            preDeployCommand: env POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare
            healthCheckPath: /health
            autoDeployTrigger: checksPass
            numInstances: 1
            envVars:
              - fromGroup: chatwoot-shared
              - key: WEB_CONCURRENCY
                value: "2"
              - key: RAILS_MAX_THREADS
                value: "5"
              - key: DATABASE_URL
                fromDatabase:
                  name: chatwoot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: chatwoot-kv
                  property: connectionString

          - type: worker
            name: chatwoot-worker
            runtime: docker
            region: virginia
            plan: standard
            branch: main
            dockerfilePath: ./docker/Dockerfile
            dockerContext: .
            dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 60
            envVars:
              - fromGroup: chatwoot-shared
              - key: SIDEKIQ_CONCURRENCY
                value: "10"
              - key: DATABASE_URL
                fromDatabase:
                  name: chatwoot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: chatwoot-kv
                  property: connectionString

          - type: keyvalue
            name: chatwoot-kv
            region: virginia
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: []          # private network only

        databases:
          - name: chatwoot-db
            region: virginia
            plan: basic-1gb
            diskSizeGB: 15
            postgresMajorVersion: "16"
            databaseName: chatwoot_production
            user: chatwoot
            ipAllowList: []          # private network only
